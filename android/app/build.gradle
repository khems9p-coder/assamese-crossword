plugins {
    id 'com.android.application'
}

// ---- App settings -----------------------------------------------------------
// The app opens this web address full screen (Trusted Web Activity).
def twa = [
    host      : 'khems9p-coder.github.io',
    startUrl  : 'https://khems9p-coder.github.io/assamese-crossword/index.html',
    pathPrefix: '/assamese-crossword',
]
// Raise versionName for each Play release. versionCode comes from the build
// number on GitHub Actions (or 1 for a local build) so it always goes up.
def appVersionName = '1.0.0'
def appVersionCode = (System.getenv('VERSION_CODE') ?: '1').toInteger()

android {
    namespace 'com.kbxstudios.shabdajal'
    compileSdk 36

    defaultConfig {
        applicationId 'com.kbxstudios.shabdajal'
        minSdk 21
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
        manifestPlaceholders = [hostName: twa.host, pathPrefix: twa.pathPrefix]
        resValue 'string', 'launchUrl', twa.startUrl
    }

    signingConfigs {
        release {
            // Supplied by the GitHub Actions workflow (see android/README.md).
            def ks = System.getenv('KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
