<!DOCTYPE html>
<html lang="as">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4dc">
  <meta name="description" content="Assamese and English picture crossword: look at the doodle, fill the word.">
  <title>শব্দজাল · Assamese Picture Crossword</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- hand-drawn wobble used by every doodle -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
  </svg>
  <div id="app"></div>
  <script src="config.js"></script>
  <script src="cloud.js"></script>
  <script src="ads.js"></script>
  <script src="icons.js"></script>
  <script src="puzzles.js"></script>
  <script src="app.js"></script>
</body>
</html>
