name: Build Android app (APK + AAB)

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Signing key: from repository secrets if they exist (use these for Play).
      # Without them a throw-away test key is made, good only for trying the APK.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/upload.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=upload key (from secrets)" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret found - signing with a temporary TEST key. Do not upload this AAB to Play."
            keytool -genkeypair -keystore "$KS" -alias test -keyalg RSA -keysize 2048 -validity 365 \
              -storepass testpass -keypass testpass -dname "CN=Test, O=KBX Studios, C=IN"
            echo "KEYSTORE_PASSWORD=testpass" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=test" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=testpass" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=temporary TEST key" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build APK and AAB
        working-directory: android
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Collect files
        run: |
          mkdir -p out
          V="1.0.0-build${VERSION_CODE}"
          cp android/app/build/outputs/apk/release/app-release.apk "out/shabdajal-${V}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/shabdajal-${V}.aab"
          SHA=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -m1 "SHA256:" | sed 's/.*SHA256: //')
          cat > out/assetlinks.json <<JSON
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "com.kbxstudios.shabdajal",
              "sha256_cert_fingerprints": ["${SHA}"]
            }
          }]
          JSON
          sed -i 's/^          //' out/assetlinks.json
          {
            echo "### শব্দজাল build ${V}"
            echo "Signed with: **${SIGNED_WITH}**"
            echo "Signing key SHA-256: \`${SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: shabdajal-android-build${{ github.run_number }}
          path: out/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build${{ github.run_number }}
          name: "শব্দজাল Android build ${{ github.run_number }} (v1.0.0)"
          body: |
            Signed with: ${{ env.SIGNED_WITH }}
            - `.apk` – install directly on a phone to test
            - `.aab` – upload to Google Play Console
            - `assetlinks.json` – publish at https://khems9p-coder.github.io/.well-known/assetlinks.json
          files: out/*
